<svg viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" font-family="Microsoft JhengHei, PingFang TC, sans-serif">
  <title>前片版片領口：寬度與深度</title>
  <rect width="680" height="240" fill="#ffffff"/>

  <!-- 左：AI 給的（現在） -->
  <path d="M11,150 L11,139.3 L44.5,69.8 L68.2,59.7 C68.2,87.4 87,110.1 110,110.1 C133,110.1 151.8,87.4 151.8,59.7 L175.5,69.8 L209,139.3 L209,150 Z" fill="#e4e2dc" stroke="#888780"/>
  <path d="M68.2,59.7 C68.2,87.4 87,110.1 110,110.1 C133,110.1 151.8,87.4 151.8,59.7" fill="none" stroke="#D85A30" stroke-width="3"/>
  <line x1="68.2" y1="59.7" x2="151.8" y2="59.7" stroke="#378ADD" stroke-dasharray="4 3"/>
  <line x1="110" y1="59.7" x2="110" y2="110.1" stroke="#378ADD"/>
  <circle cx="68.2" cy="59.7" r="4" fill="#378ADD"/><circle cx="151.8" cy="59.7" r="4" fill="#378ADD"/>
  <text x="110" y="50" font-size="12" fill="#185FA5" text-anchor="middle">開口寬 23.2 cm</text>
  <text x="115" y="90" font-size="12" fill="#185FA5">前深 14</text>

  <!-- 中：只把寬度調小 -->
  <path d="M241,150 L241,139.3 L274.5,69.8 L318,51.8 C318,83.9 327.9,110.1 340,110.1 C352.1,110.1 362,83.9 362,51.8 L405.5,69.8 L439,139.3 L439,150 Z" fill="#e4e2dc" stroke="#888780"/>
  <path d="M318,51.8 C318,83.9 327.9,110.1 340,110.1 C352.1,110.1 362,83.9 362,51.8" fill="none" stroke="#D85A30" stroke-width="3"/>
  <line x1="318" y1="51.8" x2="362" y2="51.8" stroke="#378ADD" stroke-dasharray="4 3"/>
  <line x1="340" y1="51.8" x2="340" y2="110.1" stroke="#378ADD"/>
  <circle cx="298.2" cy="59.7" r="4" fill="none" stroke="#378ADD" stroke-dasharray="2 2"/><circle cx="381.8" cy="59.7" r="4" fill="none" stroke="#378ADD" stroke-dasharray="2 2"/>
  <circle cx="318" cy="51.8" r="4" fill="#378ADD"/><circle cx="362" cy="51.8" r="4" fill="#378ADD"/>
  <text x="340" y="42" font-size="12" fill="#185FA5" text-anchor="middle">開口寬 12.2 cm</text>
  <text x="345" y="90" font-size="12" fill="#185FA5">前深 16.2</text>

  <!-- 右：前後領深調成 0 -->
  <path d="M471,150 L471,139.3 L504.5,69.8 L533.5,57.6 C533.5,71.6 550,83.1 570,83.1 C590,83.1 606.5,71.6 606.5,57.6 L635.5,69.8 L669,139.3 L669,150 Z" fill="#e4e2dc" stroke="#888780"/>
  <path d="M533.5,57.6 C533.5,71.6 550,83.1 570,83.1 C590,83.1 606.5,71.6 606.5,57.6" fill="none" stroke="#1D9E75" stroke-width="3"/>
  <line x1="533.5" y1="57.6" x2="606.5" y2="57.6" stroke="#378ADD" stroke-dasharray="4 3"/>
  <line x1="570" y1="57.6" x2="570" y2="83.1" stroke="#378ADD"/>
  <circle cx="533.5" cy="57.6" r="4" fill="#378ADD"/><circle cx="606.5" cy="57.6" r="4" fill="#378ADD"/>
  <text x="570" y="48" font-size="12" fill="#185FA5" text-anchor="middle">開口寬 20.3 cm</text>
  <text x="575" y="75" font-size="12" fill="#185FA5">前深 7.1</text>

  <text x="110" y="178" font-size="14" font-weight="600" fill="#1d1d1b" text-anchor="middle">AI 給的（現在）</text>
  <text x="110" y="198" font-size="12" fill="#5f5e5a" text-anchor="middle">領口一圈 71.6 cm</text>
  <text x="340" y="178" font-size="14" font-weight="600" fill="#1d1d1b" text-anchor="middle">只把寬度調小</text>
  <text x="340" y="198" font-size="12" fill="#5f5e5a" text-anchor="middle">變深了，一圈 74.0 cm</text>
  <text x="570" y="178" font-size="14" font-weight="600" fill="#1d1d1b" text-anchor="middle">前後領深調成 0</text>
  <text x="570" y="198" font-size="12" fill="#5f5e5a" text-anchor="middle">一圈 52.5 cm</text>

  <circle cx="20" cy="226" r="4" fill="#378ADD"/>
  <text x="30" y="230" font-size="12" fill="#5f5e5a">頸側點（領口和肩線交會）</text>
  <circle cx="210" cy="226" r="4" fill="none" stroke="#378ADD" stroke-dasharray="2 2"/>
  <text x="220" y="230" font-size="12" fill="#5f5e5a">頸側點原本的位置</text>
  <line x1="360" y1="226" x2="384" y2="226" stroke="#D85A30" stroke-width="3"/>
  <text x="390" y="230" font-size="12" fill="#5f5e5a">領口弧線（前片），長度＝領口周長的前半</text>
</svg>
